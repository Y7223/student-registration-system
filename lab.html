<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Portal</h1>
    <h5> Welcome to XYZ Institute .Please fill out the form below</h5>
    <hr>
    <h2> Student Profile</h2>
    <img src="https://tse1.explicit.bing.net/th/id/OIP.UirWc-_agU3sLXPag8vCUQHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" width="200" alt="avatar">
    <hr>
    <h2>Student Registration Form</h2>
    <form>
        <label for="fname">Full Name:</label>
        <input type="text" id="fname" placeholder="Enter Your full name">
        <br><br>
        <label for="email">Email:</label>
        <input type="text" id="email" placeholder="Enter your email" > 
        <br><br>
        <label for="password">Password:</label>
        <input type="text" id="password" placeholder="Enter your password" >
        <br><br>
        <label for="mobile">Phone Number:</label>
        <input type="tel" id="mobile" placeholder="Enter your phone number">
        <br><br>
        <label for="datepicker">Date of birth</label>
        <input type="date" id="datepicker">
        <br><br><br>
        <label >Gender:</label><br>
        <br>
        <label >Male</label>
        <input type="radio" name="Gender:">
        <label >Female</label>
        <input type="radio" name="Gender:">
        <label >Other</label>
        <input type="radio" name="Gender:"><br><br><br>
        <hr>
        <label >Skills:</label><br><br>
        <label >HTML</label>
        <input type="checkbox" name="Skills:">
        <label>CSS</label>
        <input type="checkbox" name="Skills:">
        <label>Javascript</label>
        <input type="checkbox" name="Skills:">
        <label>React</label>
        <input type="checkbox" name="Skills:"><br><br>
        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
        <option value="" selected disabled>-- Select Course --</option>
        <option value="core">Core</option>
        <option value="aiml">AI & ML</option>
        <option value="cse">CSE</option>
        <option value="it">IT</option>
        </select><br><br>
        <label for="mode">Preferred Learning Mode:</label><br><br>
        <label >Online</label>
        <input type="radio" name="mode">
        <label >Offline</label>
        <input type="radio" name="mode"><br><br>
        <label for="qualification">Highest Qualification:</label>
        <select name="qualification" id="qualification">
        <option value="" selected disabled>--Select Qualification--</option>
        <option value="12">12th</option>
        <option value="10">10th</option>
        <option value="undergraduate">Undergraduate</option>
        <option value="postgraduate">Postgraduate</option>
        </select><br><br>
        <label for="city">Select City:</label>
        <select name="city" id="city">
            <option value="" selected disabled>--Select city--</option>
            <option value="dilli">Delhi</option>
            <option value="gzb">Ghaziabad</option>
            <option value="vglj">Jhansi</option>
            <option value="sdl">Shahdol</option>
            <option value="mas">Chennai</option>
        </select><br><br>
        <label for="address">Address:</label><br>
        <textarea name="address" id="address" cols="50" rows="5" placeholder="Enter your Address..."></textarea><br><br>
        <button>Register</button>
        <button>Reset</button>
        <hr>
    </form>

</body>
</html>
